{% load static %}
<!doctype html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>வினாடி-வினா — நம்ம நகரம்</title>
  <link href="{% static 'app/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'app/css/site_chrome.css' %}" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f2e9;
      --ink: #15372f;
      --leaf: #36775f;
      --sun: #f6b941;
      --coral: #e76f51;
    }
    body { background: var(--paper); color: var(--ink); font-family: sans-serif; }
    .quiz-card {
      max-width: 650px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    .option-btn {
      width: 100%;
      text-align: left;
      margin-bottom: 0.75rem;
      padding: 0.8rem 1.2rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: #fff;
      font-weight: 600;
      transition: all 0.2s;
    }
    .option-btn:hover { background: #f0f7f4; border-color: var(--leaf); }
    .option-btn.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .option-btn.incorrect { background: #f8d7da; border-color: #dc3545; color: #721c24; }
  </style>
</head>
<body>
  {% include 'partials/site_header.html' %}

  <div class="container">
    <div class="quiz-card" id="quiz-container">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="badge bg-success" id="question-count">கேள்வி 1 / 5</span>
        <span class="fw-bold" id="score-display">மதிப்பெண்: 0</span>
      </div>

      <h4 id="question-text" class="mb-4">கேள்வி ஏற்றப்படுகிறது...</h4>
      <div id="options-container"></div>

      <div class="mt-4 text-end">
        <button id="next-btn" class="btn btn-primary d-none" onclick="nextQuestion()">அடுத்த கேள்வி →</button>
      </div>
    </div>

    <!-- Final Score Display -->
    <div class="quiz-card text-center d-none" id="result-container">
      <h2>🎉 வாழ்த்துகள்!</h2>
      <p class="fs-4 mt-3">நீங்கள் 5 கேள்விகளுக்கு <strong id="final-score">0</strong> சரியான பதில்கள் அளித்துள்ளீர்கள்!</p>
      <button class="btn btn-success btn-lg mt-3" onclick="startNewQuiz()">மீண்டும் விளையாடு 🔄</button>
    </div>
  </div>

  <script src="{% static 'app/js/quiz_questions.js' %}"></script>
  <script>
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function startNewQuiz() {
      // Pick 5 random questions from the 1000 pool
      const shuffled = [...QUIZ_QUESTIONS].sort(() => 0.5 - Math.random());
      currentQuestions = shuffled.slice(0, 5);
      currentIndex = 0;
      score = 0;

      document.getElementById('result-container').classList.add('d-none');
      document.getElementById('quiz-container').classList.remove('d-none');
      showQuestion();
    }

    function showQuestion() {
      const q = currentQuestions[currentIndex];
      document.getElementById('question-count').innerText = `கேள்வி ${currentIndex + 1} / 5`;
      document.getElementById('score-display').innerText = `மதிப்பெண்: ${score}`;
      document.getElementById('question-text').innerText = q.q;
      document.getElementById('next-btn').classList.add('d-none');

      const optionsDiv = document.getElementById('options-container');
      optionsDiv.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx, q.answer, btn);
        optionsDiv.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, correctIndex, btn) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      if (selectedIndex === correctIndex) {
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('incorrect');
        allBtns[correctIndex].classList.add('correct');
      }

      document.getElementById('next-btn').classList.remove('d-none');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < 5) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz-container').classList.add('d-none');
      document.getElementById('result-container').classList.remove('d-none');
      document.getElementById('final-score').innerText = score;
    }

    // Auto start on page load
    window.onload = startNewQuiz;
  </script>
</body>
</html>
